[package]
name = "nemdiag-rs"
version = "0.1.0"
edition = "2024"
description = "Nemdiag Linux Hardware Diagnostics"
license = "MIT"

[dependencies]
bytemuck = "1.25.2"
nvml-wrapper = "0.12.1"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
wgpu = "30.0.0"
tauri = { version = "2.0.0", features = [] }
reqwest = { version = "0.12.5", features = ["json", "blocking"] }
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[package.metadata.deb]
maintainer = "Team <team@example.com>"
copyright = "2026"
extended-description = "Nemdiag Linux Hardware Diagnostics"
depends = "$auto"
assets = [
    ["target/release/nemdiag-rs", "usr/bin/", "755"],
    ["nemdiag.desktop", "usr/share/applications/", "644"],
    ["icons/icon.png", "usr/share/icons/hicolor/512x512/apps/nemdiag.png", "644"]
]

