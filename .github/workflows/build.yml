name: Build Nemdiag for Linux

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies (Tauri & wgpu)
      run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev libwayland-dev libxkbcommon-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-deb and cargo-appimage
      run: cargo install cargo-deb cargo-appimage

    - name: Build project (Release)
      run: cargo build --release

    - name: Build .deb package
      run: cargo deb

    - name: Build .AppImage package
      run: |
        mkdir -p AppDir/usr/bin
        cp target/release/nemdiag-rs AppDir/usr/bin/
        cp nemdiag.desktop AppDir/
        cp icons/icon.png AppDir/nemdiag.png
        cargo appimage

    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nemdiag-linux-deb
        path: target/debian/*.deb

    - name: Upload .AppImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nemdiag-linux-appimage
        path: "*.AppImage"

    - name: Upload Binaries to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          target/debian/*.deb
          *.AppImage
