name: Build Nemdiag for Linux

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies (Tauri & wgpu)
      run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev libwayland-dev libxkbcommon-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install appimagetool
      run: |
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool-bin
        chmod +x /usr/local/bin/appimagetool-bin
        # Fix for AppImage in Docker/Actions (requires FUSE, but we can extract it instead)
        echo -e '#!/bin/bash\n/usr/local/bin/appimagetool-bin --appimage-extract-and-run "$@"' > /usr/local/bin/appimagetool
        chmod +x /usr/local/bin/appimagetool

    - name: Install cargo-deb and cargo-appimage
      run: cargo install cargo-deb cargo-appimage

    - name: Build project (Release)
      run: cargo build --release

    - name: Build .deb package
      run: cargo deb

    - name: Build .AppImage package
      run: |
        # cargo-appimage expects icon.png in the root directory
        cp icons/icon.png ./icon.png
        cargo appimage

    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nemdiag-linux-deb
        path: target/debian/*.deb

    - name: Upload .AppImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nemdiag-linux-appimage
        path: "**/*.AppImage"

    - name: Upload Binaries to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        prerelease: true
        files: |
          target/debian/*.deb
          **/*.AppImage
